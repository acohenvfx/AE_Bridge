<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141c2b"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="span" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)" stroke="rgba(120,148,180,.25)" stroke-width="2"/>
  <!-- left pier (Avid) -->
  <rect x="24" y="46" width="14" height="46" rx="3" fill="#8aa4bf"/>
  <!-- right pier (AE) -->
  <rect x="90" y="46" width="14" height="46" rx="3" fill="#8aa4bf"/>
  <!-- bridge span -->
  <path d="M31 50 C 52 30, 76 30, 97 50" fill="none" stroke="url(#span)" stroke-width="7" stroke-linecap="round"/>
  <!-- suspension cables -->
  <line x1="46" y1="40" x2="46" y2="60" stroke="url(#span)" stroke-width="3" stroke-linecap="round" opacity=".7"/>
  <line x1="64" y1="34" x2="64" y2="60" stroke="url(#span)" stroke-width="3" stroke-linecap="round" opacity=".7"/>
  <line x1="82" y1="40" x2="82" y2="60" stroke="url(#span)" stroke-width="3" stroke-linecap="round" opacity=".7"/>
  <!-- deck -->
  <rect x="28" y="58" width="72" height="6" rx="3" fill="url(#span)"/>
  <!-- round-trip arrows -->
  <path d="M44 78 h40" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
  <path d="M80 72 l6 6 l-6 6" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M84 92 h-40" stroke="#7c5cff" stroke-width="4" stroke-linecap="round"/>
  <path d="M48 86 l-6 6 l6 6" fill="none" stroke="#7c5cff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
